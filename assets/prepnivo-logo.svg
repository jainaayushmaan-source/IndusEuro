<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 40" role="img" aria-label="PrepNivo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Recreated from prepnivo.com sidebar: four-circle mark + two-tone wordmark. Uses currentColor-free tokens; swap fills via CSS vars in-app. -->
  <g fill="none" stroke-width="3">
    <circle cx="11" cy="11" r="6" stroke="var(--logo-mark-1, #2E9B63)"/>
    <circle cx="27" cy="11" r="6" stroke="var(--logo-mark-2, #9AA6A0)"/>
    <circle cx="11" cy="27" r="6" stroke="var(--logo-mark-2, #9AA6A0)"/>
    <circle cx="27" cy="27" r="6" stroke="var(--logo-mark-1, #2E9B63)"/>
  </g>
  <text x="42" y="27" font-family="var(--font-display, 'Nunito'), sans-serif" font-weight="800" font-size="20">
    <tspan fill="var(--logo-text, #1F2A24)">Prep</tspan><tspan fill="var(--logo-accent, #2E9B63)">Nivo</tspan>
  </text>
</svg>
