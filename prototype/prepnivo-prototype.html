<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrepNivo Parent — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700&display=swap" rel="stylesheet">
<script>
  // Apply the saved theme before first paint (Light / Dark / System, default System).
  (function () {
    var t = 'system';
    try { var s = JSON.parse(localStorage.getItem('prepnivo-proto-v2') || 'null'); if (s && s.theme) t = s.theme; } catch (e) {}
    if (location.hash.indexOf('#/kid') === 0) t = 'light';
    var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', dark);
  })();
</script>
<style>
/* ============ Colour tokens (SPEC §6). Hex values live ONLY here. ============ */
:root, .theme-light {
  --bg: #EAF4EE;
  --surface: #FFFFFF;
  --surface-2: #F4F9F6;
  --border: #D6E5DC;
  --text: #1F2A24;
  --text-muted: #55665C;
  --primary: #2E9B63;          /* UI only: borders, icons, rings, fills without text (DECISIONS #2) */
  --on-primary: #FFFFFF;
  --primary-soft: #DDF1E5;
  --warning: #B26A00;          /* UI only: borders, icons (DECISIONS #2) */
  --danger: #C2362B;
  --success: #2E7D4F;
  --focus: #1B6FD8;
  --nivo-disc: #FBF6EE;
  /* Added tokens (DECISIONS #3) */
  --primary-strong: #1F7046;   /* green text, links, filled-button backgrounds */
  --border-strong: #7D9286;    /* input / control borders, 3:1 */
  --warning-soft: #FDF1DC;
  --danger-soft: #FBE7E4;
  --on-danger: #FFFFFF;
  --overlay: rgba(17, 26, 22, 0.45);
  --shadow: 0 1px 2px rgba(31, 42, 36, 0.06), 0 4px 16px rgba(31, 42, 36, 0.06);
  --chart-1: #2E9B63;
  --chart-2: #3B6FB6;
  --chart-3: #B26A00;
  --chart-4: #8A4FB8;
  /* Data-art palette (SPEC §5.12): one colour per subject slot. UI marks only, 3:1 on --bg and --surface. */
  --viz-1: #0F6E56;
  --viz-2: #185FA5;
  --viz-3: #854F0B;
  --viz-4: #534AB7;
  --viz-5: #993C1D;
  --viz-6: #993556;
  --logo-mark-1: var(--primary);
  --logo-mark-2: #9AA6A0;
  --logo-text: var(--text);
  --logo-accent: var(--primary);
  color-scheme: light;
}
.dark, .theme-dark {
  --bg: #111A16;
  --surface: #18231E;
  --surface-2: #203029;
  --border: #2F4239;
  --text: #E8F1EC;
  --text-muted: #A7B9AF;
  --primary: #4CC48A;
  --on-primary: #0C1F15;
  --primary-soft: #1E3A2C;
  --warning: #F2B24C;
  --danger: #FF8A80;
  --success: #6FD39E;
  --focus: #7FB2FF;
  --nivo-disc: #FBF6EE;
  --primary-strong: #4CC48A;
  --border-strong: #6E857A;
  --warning-soft: #3A2C12;
  --danger-soft: #3B1E1C;
  --on-danger: #2A0E0B;
  --overlay: rgba(0, 0, 0, 0.6);
  --shadow: none;              /* dark elevation comes from lighter surfaces */
  --chart-1: #4CC48A;
  --chart-2: #7FB2FF;
  --chart-3: #F2B24C;
  --chart-4: #C9A2F0;
  --viz-1: #5DCAA5;
  --viz-2: #85B7EB;
  --viz-3: #FAC775;
  --viz-4: #AFA9EC;
  --viz-5: #F0997B;
  --viz-6: #ED93B1;
  --logo-mark-2: #6E857A;
  color-scheme: dark;
}

/* ============ Type scale (SPEC §6). Nothing below 14px. ============ */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Nunito Sans', system-ui, sans-serif;
  font-size: 17px; line-height: 26px; font-weight: 400;
  -webkit-font-smoothing: antialiased;
}
.theme-light, .theme-dark { background: var(--bg); color: var(--text); }
h1, h2, h3, h4, .h1, .h2, .h3, .h4 { font-family: 'Nunito', system-ui, sans-serif; margin: 0; }
.h1, h1 { font-size: 36px; line-height: 40px; font-weight: 800; }
.h2, h2 { font-size: 28px; line-height: 34px; font-weight: 800; }
.h3, h3 { font-size: 21px; line-height: 28px; font-weight: 700; }
.h4, h4 { font-size: 18px; line-height: 26px; font-weight: 700; }
.t-body { font-size: 17px; line-height: 26px; }
.t-ui { font-size: 15px; line-height: 22px; font-weight: 600; }
.t-cap { font-size: 14px; line-height: 20px; font-weight: 500; }
.muted { color: var(--text-muted); }
.strong { font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
p { margin: 0; }
a { color: var(--primary-strong); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ============ Layout ============ */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 264px; flex: 0 0 264px; background: var(--surface); border-right: 1px solid var(--border);
  padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 0; height: 100vh;
}
.sidebar .logo { width: 168px; height: 40px; margin: 0 8px; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 0 32px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20;
}
.content { padding: 32px; width: 100%; max-width: 1264px; margin: 0 auto; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
.page-head p { margin-top: 4px; }
.row { display: flex; align-items: center; gap: 8px; }
.row-16 { display: flex; align-items: center; gap: 16px; }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack-8 > * + * { margin-top: 8px; }
.stack-16 > * + * { margin-top: 16px; }
.stack-24 > * + * { margin-top: 24px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
.grow { flex: 1; min-width: 0; }
.mt8 { margin-top: 8px; } .mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; } .mt32 { margin-top: 32px; }
.mb8 { margin-bottom: 8px; } .mb16 { margin-bottom: 16px; }

/* ============ Sidebar parts ============ */
.switcher { position: relative; }
.switch-btn {
  width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px;
  border: 1px solid var(--border-strong); background: var(--surface-2); cursor: pointer; text-align: left;
}
.switch-btn:hover { background: var(--primary-soft); }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; flex: 0 0 auto;
  background: var(--primary-soft); font-size: 22px; line-height: 1; border: 1px solid var(--border);
}
.avatar.lg { width: 56px; height: 56px; font-size: 30px; }
.avatar.sm { width: 32px; height: 32px; font-size: 18px; }
.nav { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px;
  color: var(--text); text-decoration: none; font-size: 15px; line-height: 22px; font-weight: 600;
}
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { background: var(--primary-soft); color: var(--text); box-shadow: inset 3px 0 0 var(--primary); }
.nav a[aria-current="page"] .ic { color: var(--primary-strong); }
.nav .count { margin-left: auto; }
.side-foot { margin-top: auto; padding: 12px; border-radius: 12px; background: var(--surface-2); }

/* ============ Top bar ============ */
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 15px; line-height: 22px; font-weight: 600; min-width: 0; flex-wrap: wrap; }
.crumbs a { color: var(--text-muted); text-decoration: none; font-weight: 600; }
.crumbs a:hover { color: var(--text); text-decoration: underline; }
.crumbs .sep { color: var(--text-muted); }
.crumbs [aria-current] { color: var(--text); }
.top-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.icon-btn {
  position: relative; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); display: inline-grid; place-items: center; cursor: pointer; color: var(--text);
}
.icon-btn:hover { background: var(--surface-2); }
.dot-badge {
  position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px;
  background: var(--danger); color: var(--on-danger); font-size: 14px; line-height: 22px; font-weight: 700; text-align: center;
  border: 2px solid var(--surface);
}
.pill-count {
  min-width: 24px; height: 24px; padding: 0 8px; border-radius: 12px; background: var(--danger); color: var(--on-danger);
  font-size: 14px; line-height: 24px; font-weight: 700; text-align: center; display: inline-block;
}
.pill-count.neutral { background: var(--surface-2); color: var(--text); border: 1px solid var(--border-strong); line-height: 22px; }
.popover {
  position: absolute; z-index: 40; background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  box-shadow: var(--shadow); padding: 8px; min-width: 260px;
}
.dark .popover, .dark .modal { border-color: var(--border-strong); }
.pop-right { right: 0; top: 52px; }
.pop-below { left: 0; right: 0; top: calc(100% + 8px); }
.menu-item {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 10px; border: 0;
  background: none; cursor: pointer; text-align: left; font-size: 15px; line-height: 22px; font-weight: 600; color: var(--text); text-decoration: none;
}
.menu-item:hover { background: var(--surface-2); }
.menu-item[aria-checked="true"] { background: var(--primary-soft); }
.notif { padding: 12px; border-radius: 12px; display: flex; gap: 12px; align-items: flex-start; text-decoration: none; color: var(--text); }
.notif:hover { background: var(--surface-2); }
.notif.unread { background: var(--surface-2); }

/* ============ Buttons & inputs ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px;
  border-radius: 12px; border: 1px solid transparent; cursor: pointer; text-decoration: none; white-space: nowrap;
  font-size: 15px; line-height: 22px; font-weight: 700; font-family: 'Nunito Sans', sans-serif;
}
.btn-primary { background: var(--primary-strong); color: var(--on-primary); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn-secondary:hover { background: var(--surface-2); }
.btn-ghost { background: transparent; color: var(--text); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { background: var(--danger); color: var(--on-danger); }
.btn-sm { height: 36px; padding: 0 12px; }
.btn-block { width: 100%; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .55; cursor: not-allowed; filter: none; }
.link-btn { background: none; border: 0; padding: 0; cursor: pointer; color: var(--primary-strong); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .label { font-size: 15px; line-height: 22px; font-weight: 600; }
.hint { font-size: 14px; line-height: 20px; color: var(--text-muted); }
.err { font-size: 14px; line-height: 20px; color: var(--danger); font-weight: 600; display: flex; gap: 6px; align-items: center; }
.input, select.input, textarea.input {
  height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--surface);
  font-size: 17px; width: 100%;
}
textarea.input { height: auto; min-height: 112px; padding: 12px 14px; resize: vertical; }
.input:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
.input[aria-invalid="true"] { border-color: var(--danger); }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--primary-strong); flex: 0 0 auto; }
.seg { display: inline-flex; padding: 4px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border-strong); gap: 4px; }
.seg button { border: 0; background: none; padding: 8px 16px; border-radius: 9px; cursor: pointer; font-size: 15px; line-height: 22px; font-weight: 700; color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: inset 0 0 0 2px var(--primary); }
.toggle { position: relative; width: 52px; height: 30px; border-radius: 15px; border: 1px solid var(--border-strong); background: var(--surface-2); cursor: pointer; flex: 0 0 auto; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--text-muted); transition: left .15s; }
.toggle[aria-checked="true"] { background: var(--primary-strong); border-color: var(--primary-strong); }
.toggle[aria-checked="true"]::after { left: 25px; background: var(--on-primary); }

/* ============ Cards, badges, tables ============ */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); }
.card.tight { padding: 16px; }
.card.soft { background: var(--surface-2); box-shadow: none; }
.card-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border-strong);
  font-size: 14px; line-height: 22px; font-weight: 600; background: var(--surface); color: var(--text); white-space: nowrap;
}
.badge .ic { flex: 0 0 auto; }
.badge.ok { border-color: var(--success); } .badge.ok .ic { color: var(--success); }
.badge.warn { border-color: var(--warning); background: var(--warning-soft); } .badge.warn .ic { color: var(--warning); }
.badge.bad { border-color: var(--danger); background: var(--danger-soft); } .badge.bad .ic { color: var(--danger); }
.badge.info { border-color: var(--primary); background: var(--primary-soft); } .badge.info .ic { color: var(--primary-strong); }
.badge.lock .ic { color: var(--text-muted); }
.table { width: 100%; border-collapse: collapse; font-size: 15px; line-height: 22px; }
.table th { text-align: left; font-weight: 700; color: var(--text-muted); padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.table td { padding: 14px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr.click:hover { background: var(--surface-2); cursor: pointer; }
.table .r { text-align: right; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
.tabs button, .tabs a {
  border: 0; background: none; padding: 12px 16px; cursor: pointer; font-size: 15px; line-height: 22px; font-weight: 700;
  color: var(--text-muted); border-bottom: 3px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 8px; align-items: center; text-decoration: none;
}
.tabs [aria-selected="true"] { color: var(--text); border-bottom-color: var(--primary); }
.alert { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); border-left-width: 6px; }
.alert .ic { flex: 0 0 auto; }
.alert.warn { border-left-color: var(--warning); background: var(--warning-soft); } .alert.warn > .ic { color: var(--warning); }
.alert.bad { border-left-color: var(--danger); background: var(--danger-soft); } .alert.bad > .ic { color: var(--danger); }
.alert.info { border-left-color: var(--primary); background: var(--primary-soft); } .alert.info > .ic { color: var(--primary-strong); }
.bar { height: 10px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--primary); border-radius: 5px; }
.bar.warn > span { background: var(--warning); }
.bar.bad > span { background: var(--danger); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 15px; line-height: 22px; }
.kv dt { color: var(--text-muted); font-weight: 600; } .kv dd { margin: 0; font-weight: 600; }
.divider { height: 1px; background: var(--border); margin: 16px 0; border: 0; }

/* ============ Stat cards & rings ============ */
.stat { display: flex; gap: 16px; align-items: center; }
.stat .big { font-family: 'Nunito', sans-serif; font-size: 36px; line-height: 40px; font-weight: 800; }
.ring { position: relative; flex: 0 0 auto; }
.ring svg { display: block; transform: rotate(-90deg); }
.ring .track { stroke: var(--surface-2); }
.ring .val { stroke: var(--primary); transition: stroke-dasharray .4s; }
.ring .val.c2 { stroke: var(--chart-2); } .ring .val.c4 { stroke: var(--chart-4); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 18px; }

/* ============ Day strip ============ */
.strip { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 6px; }
.day {
  border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 8px 2px 10px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 108px;
}
.day:hover { background: var(--surface-2); }
.day[aria-pressed="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 2px var(--primary); background: var(--primary-soft); }
.day .dw { font-size: 14px; line-height: 20px; color: var(--text-muted); font-weight: 600; }
.day .dn { font-size: 15px; line-height: 22px; font-weight: 700; }
.day .dotwrap { height: 34px; display: grid; place-items: center; }
.day .dotm { border-radius: 50%; background: var(--primary); }
.day .none { width: 10px; height: 2px; background: var(--border-strong); border-radius: 1px; }

/* ============ Misc ============ */
.skel { border-radius: 12px; background: linear-gradient(90deg, var(--surface-2) 0%, var(--border) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: sh 1.1s infinite linear; }
@keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.empty { text-align: center; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty p { max-width: 460px; }
.nivo { display: inline-grid; place-items: center; border-radius: 50%; background: var(--nivo-disc); flex: 0 0 auto; overflow: hidden; }
.nivo svg { width: 82%; height: 82%; display: block; }
.auth-wrap { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
.auth-side { background: var(--primary-soft); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 24px; padding: 48px; text-align: center; border-right: 1px solid var(--border); }
.auth-main { display: flex; align-items: center; justify-content: center; padding: 48px; }
.auth-card { width: 100%; max-width: 460px; }
.auth-card .logo { width: 168px; height: 40px; margin-bottom: 32px; }
.otp { display: flex; gap: 10px; }
.otp input { width: 56px; height: 64px; text-align: center; font-size: 28px; font-weight: 800; font-family: 'Nunito', sans-serif; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--surface); }
.otp input:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
.devnote { border: 1px dashed var(--border-strong); background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 20px; }
.devnote code { font-size: 17px; font-weight: 800; letter-spacing: 2px; }
.meter { display: flex; gap: 4px; } .meter span { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--border); }
.meter span.on { background: var(--primary); border-color: var(--primary); }
.meter.weak span.on { background: var(--danger); border-color: var(--danger); }
.meter.mid span.on { background: var(--warning); border-color: var(--warning); }
.stepper { display: flex; gap: 8px; margin-bottom: 32px; }
.stepper li { list-style: none; flex: 1; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--text-muted); }
.stepper li::before { content: ''; height: 6px; border-radius: 3px; background: var(--border); }
.stepper li.done::before, .stepper li.cur::before { background: var(--primary); }
.stepper li.cur { color: var(--text); }
.stepper { padding: 0; margin-top: 0; }
.ob-wrap { min-height: 100vh; }
.ob-top { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; background: var(--surface); border-bottom: 1px solid var(--border); }
.ob-top .logo { width: 168px; height: 40px; }
.ob-body { max-width: 960px; margin: 0 auto; padding: 40px 32px 80px; }
.ob-body.narrow { max-width: 760px; }
.choice { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 12px; padding: 10px; cursor: pointer; display: grid; place-items: center; gap: 4px; font-size: 15px; font-weight: 600; }

function seedStats(key, plan, overrides) {
  const stats = {};
  for (const s of getCur(key).subjects) {
    const n = plan[s.id] || 0;
    s.chapters.forEach((c, ci) => {
      if (ci >= n) return;
      c.topics.forEach((t, ti) => {
        if (ci === n - 1 && ti > 0 && hashStr(t.id + 'x') < 0.4) return; // last chapter partly done
        const r = hashStr(t.id); const att = 8 + Math.floor(r * 14); const acc = 0.66 + hashStr(t.id + 'a') * 0.27;
        const cor = Math.round(att * acc); const last = daysAgo(1 + Math.floor(hashStr(t.id + 'd') * 20));
        stats[t.id] = { att, cor, last, lastWrong: att > cor ? last : null, history: hist(t.id, cor / att), missed: [], wrong: [] };
      });
    });
  }
  for (const [name, o] of Object.entries(overrides)) {
    const t = topicByName(key, name);
    stats[t.id] = { ...o, history: o.history || hist(t.id, o.cor / o.att) };
  }
  return stats;
}
function hist(id, acc) { // accuracy over the last 6 practice sessions, ending at the current value

}

/* =====================================================================
   Selectors — ONE function per metric. Every screen reads from these.
   ===================================================================== */
const M = {
  topic(c, tid) {
    const s = c.stats[tid];
    if (!s || !s.att) return { att: 0, cor: 0, acc: null, mastery: 0, last: null };
    return { att: s.att, cor: s.cor, acc: Math.round(s.cor / s.att * 100), mastery: Math.round(s.cor / s.att * Math.min(1, s.att / 10) * 100), last: s.last, lastWrong: s.lastWrong };
  },
  agg(c, topics) {
    let att = 0, cor = 0, m = 0, done = 0;
    for (const t of topics) { const x = M.topic(c, t.id); att += x.att; cor += x.cor; m += x.mastery; if (x.att) done++; }
    return { att, cor, accuracy: att ? Math.round(cor / att * 100) : null, mastery: topics.length ? Math.round(m / topics.length) : 0,
      coverage: topics.length ? Math.round(done / topics.length * 100) : 0, done, total: topics.length };
  },
  child(c) { return M.agg(c, allTopics(c.cur)); },
  subject(c, sid) { const s = subjOf(c.cur, sid); return M.agg(c, s ? s.chapters.flatMap(ch => ch.topics) : []); },
  chapter(c, sid, cid) { const ch = chapOf(c.cur, sid, cid); return M.agg(c, ch ? ch.topics : []); },
  chapterState(c, sid, ch) {
    const unlocked = (c.unlocked[sid] || 1) > ch.index; if (!unlocked) return 'locked';
    const a = M.chapter(c, sid, ch.id); if (a.done === a.total && a.total && a.accuracy >= 60) return 'passed';
    return a.done ? 'in-progress' : 'unlocked';
  },
  weak(c) {
    return allTopics(c.cur).map(t => ({ t, m: M.topic(c, t.id), s: c.stats[t.id] }))
      .filter(x => x.m.att >= 5 && x.m.acc < 60)
      .map(x => { const ago = x.m.lastWrong ? daysBetween(x.m.lastWrong, TODAY) : 99; const sev = (100 - x.m.acc) + Math.min(x.m.att, 20) + (ago <= 3 ? 15 : ago <= 7 ? 8 : 0); return { ...x, sev, ago }; })
      .sort((a, b) => b.sev - a.sev);
  },
  worthALook(c) { return M.weak(c).find(w => w.s && w.s.pattern) || null; },
  trend(c, sid) { // weekly accuracy, last 8 weeks
    const a = M.subject(c, sid); if (a.accuracy == null) return null;
    return Array.from({ length: 8 }, (_, i) => i === 7 ? a.accuracy : Math.max(5, Math.min(100, Math.round(a.accuracy - (7 - i) * (1 + hashStr(sid + c.id) * 2) + (hashStr(sid + i + c.id) - 0.5) * 8))));
  },
  masteryTrend(c, sid) { const a = M.subject(c, sid); return Array.from({ length: 8 }, (_, i) => Math.max(0, Math.round(a.mastery * (0.55 + i * 0.065)))); },
  sessionDays(c) { return Array.from({ length: 14 }, (_, i) => addDays(TODAY, i - 13)).map(d => ({ d, acts: c.sessions[d] || [] })); },
  points(a) { return a.correct * RATES[a.kind]; },
  testScore(t) { if (t.status !== 'completed' || !t.answers) return null; const cor = t.questions.filter(id => { const q = qById(id); return q && String(t.answers[id]).trim().toLowerCase() === String(q.answer).trim().toLowerCase(); }).length; return { cor, total: t.questions.length }; },
  testPoints(t) { const s = M.testScore(t); const rate = t.kind === 'challenge' ? RATES.challenge : RATES.test; return s ? s.cor * rate : t.questions.length * rate; },
  testsFor(c) { return ACC().tests.filter(t => t.childId === c.id); },
  dueTests(c) { return M.testsFor(c).filter(t => t.status === 'assigned' && daysBetween(TODAY, t.due) <= 7); },
  buddyPending(childId) { return ACC().buddy.filter(b => b.status === 'pending' && (!childId || b.childId === childId)); },
  notifications() {
    const a = ACC(); if (!a) return [];
    const n = [];
    M.buddyPending().forEach(b => { const c = childById(b.childId); n.push({ key: 'buddy-' + b.id, icon: 'users', tone: 'info', text: `${c.first} has a buddy request from ${b.name}`, sub: `${b.via} · ${fmtShort(b.date)}`, href: '#/settings/buddy-requests' }); });
    kids().filter(c => c.plan.status === 'grace').forEach(c => n.push({ key: 'grace-' + c.id, icon: 'alert', tone: 'bad', text: `Payment for ${c.first} failed on ${fmtShort(c.plan.failedOn)}`, sub: `Update your card by ${fmtShort(c.plan.graceEnds)} to keep access.`, href: '#/settings/billing' }));
    kids().filter(c => c.plan.status === 'paused').forEach(c => n.push({ key: 'paused-' + c.id, icon: 'pause', tone: 'bad', text: `${c.first}'s access is paused`, sub: 'Update your card to restore access.', href: '#/settings/billing' }));
    kids().forEach(c => M.dueTests(c).forEach(t => n.push({ key: 'due-' + t.id, icon: 'clock', tone: 'warn', text: `${c.first}: “${t.title}” is due ${wkd(t.due)} ${fmtShort(t.due)}`, sub: plural(t.questions.length, 'question'), href: '#/tests/' + t.id })));
    if (a.review.length) n.push({ key: 'review-' + a.review.length, icon: 'sparkles', tone: 'info', text: `${plural(a.review.length, 'AI draft')} waiting for your review`, sub: 'Nothing reaches your child until you approve it.', href: '#/questions/review' });
    return n;
  },
};

/* An activity in the day strip. Test activities read their score from the test (one source of truth). */
function resolveAct(a) {
  if (a.testId) {
    const t = ACC().tests.find(x => x.id === a.testId); const s = t && M.testScore(t);
    if (s) {

      return { ...a, correct: s.cor, total: s.total, mistakes, points: M.testPoints(t) };
    }
  }

}

function lineChart(series, labels, { h = 240, max = 100, unit = '%', w = 640 } = {}) {
  const W = w, H = h, L = 48, R = 16, T = 16, B = 40; const iw = W - L - R, ih = H - T - B;

/* =====================================================================
   Auth + email 2FA (SPEC §5.1). OTP: 6 digits, hashed, 10 min, 5 attempts → 15 min lock, 60 s resend cooldown.
   ===================================================================== */
const OTP_TTL = 10 * 60e3, OTP_LOCK = 15 * 60e3, OTP_COOLDOWN = 60e3, OTP_MAX_ATTEMPTS = 5, OTP_SENDS_PER_HOUR = 5;
async function sendOtp(email, purpose, next) {
  const now = Date.now(); const prev = S.otp && S.otp.email === email ? S.otp : null;
  const log = (prev ? prev.sendLog : []).filter(t => now - t < 3600e3);
  if (prev && prev.lockedUntil > now) return { error: `Too many wrong codes. Try again in ${Math.ceil((prev.lockedUntil - now) / 60e3)} minutes.` };
  if (prev && now - prev.lastSentAt < OTP_COOLDOWN && prev.purpose === purpose) return { error: `Please wait ${Math.ceil((OTP_COOLDOWN - (now - prev.lastSentAt)) / 1e3)} seconds before asking for a new code.` };
  if (log.length >= OTP_SENDS_PER_HOUR) return { error: 'Too many codes requested for this email. Try again in an hour.' };
  const code = String(Math.floor(100000 + Math.random() * 900000));
  S.otp = { email, purpose, next, hash: await sha256(code + ':' + email), expiresAt: now + OTP_TTL, attempts: 0, lockedUntil: 0, lastSentAt: now, sendLog: [...log, now], devCode: code };
  console.info(`[PrepNivo dev] OTP for ${email} (${purpose}): ${code}`);
  save(); return { ok: true };
}
async function checkOtp(code) {
  const o = S.otp; const now = Date.now();
  if (!o) return { error: 'No code was sent. Request a new code.' };
  if (o.lockedUntil > now) return { error: `Too many wrong codes. This email is locked for ${Math.ceil((o.lockedUntil - now) / 60e3)} more minutes.`, locked: true };
  if (now > o.expiresAt) return { error: 'This code has expired. Request a new code.', expired: true };
  if (await sha256(code + ':' + o.email) !== o.hash) {
    o.attempts++;
    if (o.attempts >= OTP_MAX_ATTEMPTS) { o.lockedUntil = now + OTP_LOCK; save(); return { error: 'Too many wrong codes. For your security, this email is locked for 15 minutes.', locked: true }; }
    save(); const left = OTP_MAX_ATTEMPTS - o.attempts; return { error: `That code isn't right. ${plural(left, 'attempt')} left.` };
  }
  S.otp = null; save(); return { ok: true, purpose: o.purpose, email: o.email, next: o.next };
}
function otpBoxes(prefix = 'otp') {
  return `<div class="otp" role="group" aria-label="6-digit code">${[0, 1, 2, 3, 4, 5].map(i => `<input id="${prefix}${i}" inputmode="numeric" autocomplete="${i === 0 ? 'one-time-code' : 'off'}" maxlength="1" aria-label="Digit ${i + 1}" oninput="otpInput(event,${i},'${prefix}')" onkeydown="otpKey(event,${i},'${prefix}')" onpaste="otpPaste(event,'${prefix}')">`).join('')}</div>`;
}
function otpInput(e, i, p) { const v = e.target.value.replace(/\D/g, ''); e.target.value = v.slice(-1); if (v && i < 5) document.getElementById(p + (i + 1)).focus(); if (otpCode(p).length === 6) (p === 'otp' ? submitVerify() : submitModalOtp()); }
function otpKey(e, i, p) { if (e.key === 'Backspace' && !e.target.value && i > 0) document.getElementById(p + (i - 1)).focus(); }
function otpPaste(e, p) { e.preventDefault(); const d = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6); d.split('').forEach((ch, i) => { document.getElementById(p + i).value = ch; }); document.getElementById(p + Math.min(d.length, 5)).focus(); if (d.length === 6) (p === 'otp' ? submitVerify() : submitModalOtp()); }
const otpCode = p => [0, 1, 2, 3, 4, 5].map(i => (document.getElementById(p + i) || {}).value || '').join('');

function startCountdown() {
  clearInterval(cdTimer);

// Every server-backed action goes through api(): offline, slow and server-error simulation live here.

function guard(name, failMsg) {

async function payNow() {

/* ---------- AI: offline, timeouts, cancel; import file checks ---------- */
function impFile(input, kind) {
  const f = input.files[0]; UI.err = {}; if (!f) return;
  const okType = kind === 'pdf' ? (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) : ['image/png', 'image/jpeg'].includes(f.type);
  if (!okType) UI.err = { imp: kind === 'pdf' ? `“${f.name}” isn't a PDF. Choose a .pdf file, or use the Photo tab for pictures.` : `“${f.name}” isn't a PNG or JPG photo. Take a new photo or choose another file.` };
  else if (f.size === 0) UI.err = { imp: `“${f.name}” is empty. Choose another file.` };
  else if (f.size > 20 * 1024 * 1024) UI.err = { imp: `“${f.name}” is ${Math.round(f.size / 1048576)} MB. The limit is 20 MB. Split the PDF, or photograph only the pages you need.` };
  else if (kind === 'pdf') { UI.imp.file = `${f.name} · ${Math.ceil(f.size / 1024)} KB`; UI.imp.fileName = f.name; }
  else { UI.imp.img = URL.createObjectURL(f); UI.imp.file = f.name; UI.imp.fileName = f.name; }
  render();
}

    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="const c=childById('${c.id}');c.first=val('ec-first').trim()||c.first;c.last=val('ec-last').trim();c.dob=val('ec-dob')||c.dob;c.avatar=UI.modal.avatar||c.avatar;save();closeModal();toast('Changes saved')">Save changes</button>`);
  if (m.type === 'resetLogin') { const young = curOf(c).grade <= 4;
    return modalWrap(`Reset ${c.first}'s login`, young ? `<p class="muted mb16">Tap at least 3 animals in order. ${esc(c.first)}'s old picture code stops working.</p><div class="grid" style="grid-template-columns:repeat(6,1fr)">${ANIMALS.map(([k, em, n]) => { const pos = m.animals.indexOf(k); return `<button class="choice" aria-pressed="${pos >= 0}" aria-label="${n}" onclick="const a=UI.modal.animals;const i=a.indexOf('${k}');i>=0?a.splice(i,1):a.push('${k}');render()"><span class="emo">${em}</span>${pos >= 0 ? `<span class="order-tag">${pos + 1}</span>` : '<span style="height:24px"></span>'}</button>`; }).join('')}</div>${m.err ? `<div class="err mt8">${ic('alert', 16)}${m.err}</div>` : ''}`

      `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="resetLogin('${c.id}')">Reset child login</button>`); }

    return modalWrap(`Remove ${c.first}?`, `<p>This removes ${esc(c.first)}'s profile, progress and tests from your account.</p><div class="alert warn mt16">${ic('alert', 22)}<div class="t-cap">The ${c.plan.cycle} subscription (${money(cur, PRICING[cur][c.plan.cycle])}) is cancelled and won't renew. There's no refund for the current period.</div></div><div class="mt16">${field(`Type ${esc(c.first)} to confirm`, `<input class="input" id="rm-name" autocomplete="off" oninput="document.getElementById('rm-go').disabled=this.value.trim()!=='${esc(c.first)}'">`)}</div>`,
      `<button class="btn btn-secondary" onclick="closeModal()">Keep ${esc(c.first)}</button><button class="btn btn-danger" id="rm-go" disabled onclick="removeChild('${c.id}')">Remove child</button>`); }

}
function resetLogin(id) {
  const c = childById(id); const m = UI.modal;
  if (curOf(c).grade <= 4) { if (m.animals.length < 3) { m.err = 'Choose at least 3 animals.'; render(); return; } c.login = { type: 'picture', animals: [...m.animals] }; }
  else { const p = val('rl-pin'); if (!/^\d{4}$/.test(p)) { m.err = 'The PIN must be exactly 4 digits.'; render(); return; } c.login = { type: 'pin', username: c.login.username || c.first.toLowerCase(), pin: p }; }
  save(); closeModal(); toast('Child login reset');
}
function removeChild(id) {
  const a = ACC(); const c = childById(id); a.children = a.children.filter(x => x.id !== id); a.tests = a.tests.filter(t => t.childId !== id); a.buddy = a.buddy.filter(b => b.childId !== id);
  if (a.selected === id) a.selected = a.children[0] ? a.children[0].id : null; save(); UI.modal = null; toast(`${c.first} removed`, 'trash');

/* =====================================================================
   Router
   ===================================================================== */
let rendering = false;

/* ---------- prototype tools ---------- */

/* =====================================================================
   Round 4 (11 Oct 2026, SPEC §5.12): full-screen family bloom.
   Shown on its own (nothing else on screen) when a parent first lands on Overview.
   One 3D particle flower per child, rotating slowly. One distinct petal per subject:
   petal length = mastery, particle density = mastery, flow speed = minutes in the last 14 days.
   Hover pauses the rotation and shows the subject card; click opens the subject.
   Continue (button, scroll, Enter, Esc or arrow down) lands on the Overview.
   ===================================================================== */
const VIZ_N = 6;
const REDUCED = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const vizVar = i => `var(--viz-${(i % VIZ_N) + 1})`;
const fmtMin = m => m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? ' ' + (m % 60) + ' min' : ''}` : `${m} min`;
const BLOOM = { shown: false, el: null, parts: [], sig: '', mx: -1, my: -1, hit: null, rot: 0, spin: 1, last: 0, data: [], cols: [], muted: '', colsAt: 0, pend: null };
function bloomData() {
  return kids().map(k => {
    const cur = curOf(k); const days = M.sessionDays(k); const weakAll = M.weak(k);
    const subs = cur.subjects.map((s, i) => {
      const x = M.subject(k, s.id);
      const min = days.reduce((m, d) => m + d.acts.filter(a => a.subject === s.name).reduce((q, a) => q + (a.minutes || 0), 0), 0);
      const w = weakAll.find(v => v.t.subjectId === s.id);
      const last = s.chapters.flatMap(ch => ch.topics).map(t => M.topic(k, t.id).last).filter(Boolean).sort().pop() || null;
      return { id: s.id, name: s.name, i, m: x.mastery, cor: x.cor, att: x.att, done: x.done, total: x.total, min, weak: w ? w.t.name : null, last, tbc: !!s.tbc };
    });
    return { id: k.id, first: k.first, cls: clsLabel(k), paused: k.plan.status === 'paused', mastery: M.child(k).mastery, min: subs.reduce((a, b) => a + b.min, 0), subs };
  });
}
/* Called from the Overview template: a small entry back into the bloom, and the first-visit trigger. */
function familyHero() {
  if (!BLOOM.shown) { BLOOM.shown = true; setTimeout(openBloom, 0); }
  return `<div class="row mb8" style="justify-content:flex-end"><button class="btn btn-ghost btn-sm" onclick="openBloom()">${ic('overview', 16)}Family view</button></div>`;
}
function openBloom() {
  if (BLOOM.el || !S.session || !kids().length) return;
  BLOOM.data = bloomData(); BLOOM.sig = ''; BLOOM.hit = null; BLOOM.mx = -1;
  const el = document.createElement('div'); el.className = 'bloom'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Family overview');
  el.innerHTML = `<canvas aria-hidden="true"></canvas><div class="bl-names"></div><div class="bl-tip" role="status"></div>
    <button class="bl-go" onclick="closeBloom()">Continue to overview ${ic('down', 18)}</button>
    <table class="sr"><caption>Mastery by child and subject</caption><thead><tr><th>Child</th><th>Subject</th><th>Mastery</th><th>Accuracy</th><th>Coverage</th><th>Minutes, last 14 days</th></tr></thead><tbody>${BLOOM.data.flatMap(k => k.subs.map(s => `<tr><td>${esc(k.first)}</td><td>${esc(s.name)}</td><td>${s.m}%</td><td>${s.att ? `${s.cor} / ${s.att}` : 'No answers yet'}</td><td>${s.done} / ${s.total} topics</td><td>${s.min}</td></tr>`)).join('')}</tbody></table>`;
  document.body.appendChild(el); document.body.classList.add('bloom-open'); BLOOM.el = el;
  const cv = el.querySelector('canvas');
  cv.addEventListener('mousemove', e => { BLOOM.mx = e.clientX; BLOOM.my = e.clientY; });
  cv.addEventListener('mouseleave', () => { BLOOM.mx = -1; });
  cv.addEventListener('click', () => { const h = BLOOM.hit; if (!h) return; const k = BLOOM.data[h.ki]; closeBloom(true); if (k.id !== ACC().selected) selectChild(k.id); go('/overview/subject/' + h.s.id); });
  el.addEventListener('wheel', e => { if (e.deltaY > 20) closeBloom(); }, { passive: true });
  BLOOM.onKey = e => { if (['Escape', 'ArrowDown', 'PageDown'].includes(e.key)) { e.preventDefault(); closeBloom(); } };
  document.addEventListener('keydown', BLOOM.onKey);
  setTimeout(() => { const b = el.querySelector('.bl-go'); b && b.focus({ preventScroll: true }); }, 50);
}
function closeBloom(instant) {
  const el = BLOOM.el; if (!el) return; BLOOM.el = null; document.removeEventListener('keydown', BLOOM.onKey);
  document.body.classList.remove('bloom-open');
  const main = document.querySelector('.content'); if (main && !instant) { main.classList.remove('landing'); void main.offsetWidth; main.classList.add('landing'); setTimeout(() => main.classList.remove('landing'), 1600); }
  if (instant || REDUCED()) { el.remove(); return; }
  el.classList.add('leaving'); setTimeout(() => el.remove(), 750);
}
function bloomColours() {
  const now = performance.now(); if (now - BLOOM.colsAt < 500 && BLOOM.cols.length) return;
  const cs = getComputedStyle(document.documentElement); BLOOM.cols = Array.from({ length: VIZ_N }, (_, i) => cs.getPropertyValue(`--viz-${i + 1}`).trim()); BLOOM.muted = cs.getPropertyValue('--text-muted').trim(); BLOOM.colsAt = now;
}
function bloomBuild() {
  const data = BLOOM.data; const sig = JSON.stringify(data.map(k => k.subs.map(s => [s.m, s.min])));
  if (sig === BLOOM.sig) return; BLOOM.sig = sig; BLOOM.parts = [];
  data.forEach((k, ki) => {
    for (let j = 0; j < 260; j++) BLOOM.parts.push({ ki, core: true, a: Math.random() * Math.PI * 2, r: Math.sqrt(Math.random()) * .09, y: Math.random() * .05, h: [] });
    k.subs.forEach(s => {
      const cnt = Math.round(320 + s.m * 18); const spd = .0018 + Math.min(1, s.min / 120) * .0042;
      for (let j = 0; j < cnt; j++) BLOOM.parts.push({ ki, s, ns: k.subs.length, u: Math.random(), w: (Math.random() * 2 - 1), spd: spd * (.7 + Math.random() * .6), h: [] });
    });
  });
}
/* Petal surface in the flower's own frame (y = up). u: 0 at the centre → 1 at the tip; w: −1…1 across. */
function petalPoint(s, ns, u, w, t) {
  const L = .42 + .58 * (s.m / 100); const span = Math.min(.56, Math.PI / ns * .9);
  const phi = s.i / ns * Math.PI * 2; const width = Math.pow(Math.sin(Math.PI * Math.min(1, u * 1.05)), .75) * span;
  const ang = phi + w * width * (1 - u * .25); const r = (.08 + u * L);
  const lift = Math.pow(u, 1.5) * L * .62 - Math.pow(Math.max(0, u - .75), 2) * 1.1 * L;
  const ripple = Math.sin(u * 7 + t * .0012 + s.i) * .012 + w * w * .03 * u;
  return [Math.cos(ang) * r, lift + ripple, Math.sin(ang) * r];
}
function bloomFrame(t) {
  const el = BLOOM.el; if (!el) return; const cv = el.querySelector('canvas');
  const d = Math.min(2, devicePixelRatio || 1); const W = innerWidth, H = innerHeight;
  if (cv.width !== Math.round(W * d) || cv.height !== Math.round(H * d)) { cv.width = Math.round(W * d); cv.height = Math.round(H * d); BLOOM.namesKey = ''; }
  bloomColours(); bloomBuild();
  const data = BLOOM.data; const n = data.length; const moving = !REDUCED();
  const dt = BLOOM.last ? Math.min(50, t - BLOOM.last) : 16; BLOOM.last = t;
  BLOOM.spin += ((BLOOM.hit ? 0 : 1) - BLOOM.spin) * .08; if (moving) BLOOM.rot += dt * .00016 * BLOOM.spin;
  const S = Math.min(W / n * .46, H * .5); const cy = H * .47;
  const par = BLOOM.mx >= 0 ? (BLOOM.my / H - .5) * .25 : 0; const tilt = .62 + par; const ct = Math.cos(tilt), st = Math.sin(tilt);
  const x = cv.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); x.clearRect(0, 0, W, H);
  const groups = new Map(); let best = 400, hit = null;
  BLOOM.parts.forEach(p => {
    const k = data[p.ki]; const cx = W * (p.ki + .5) / n; const ry = BLOOM.rot + p.ki * .9; const cr = Math.cos(ry), sr = Math.sin(ry);
    let P;
    if (p.core) { if (moving) p.a += .004; P = [Math.cos(p.a) * p.r, p.y, Math.sin(p.a) * p.r]; }
    else { if (moving) { p.u += p.spd * (dt / 16); if (p.u > 1) { p.u = 0; p.w = Math.random() * 2 - 1; p.h = []; } } P = petalPoint(p.s, p.ns, p.u, p.w, t); }
    const X1 = P[0] * cr - P[2] * sr, Z1 = P[0] * sr + P[2] * cr; const Y2 = P[1] * ct - Z1 * st, Z2 = P[1] * st + Z1 * ct;
    const f = 3.4 / (3.4 + Z2); const sx = cx + X1 * S * f, sy = cy - Y2 * S * f + S * .18;
    p.z = Z2; p.h.push(sx, sy); if (p.h.length > 18) p.h.splice(0, 2);
    const key = p.core ? `${p.ki}-c` : `${p.ki}-${p.s.i}`; let g = groups.get(key); if (!g) { g = { ps: [], z: 0, p0: p }; groups.set(key, g); } g.ps.push(p); g.z += Z2;
    if (!p.core && BLOOM.mx >= 0) { const dd = (sx - BLOOM.mx) ** 2 + (sy - BLOOM.my) ** 2; if (dd < best) { best = dd; hit = p; } }
  });
  BLOOM.hit = hit ? { ki: hit.ki, s: hit.s } : null;
  [...groups.values()].sort((a, b) => b.z / b.ps.length - a.z / a.ps.length).forEach(g => {
    const p0 = g.p0; const k = data[p0.ki]; const on = BLOOM.hit && !p0.core && BLOOM.hit.ki === p0.ki && BLOOM.hit.s.i === p0.s.i;
    const depth = Math.max(.45, Math.min(1, .75 - (g.z / g.ps.length) * .6));
    const dim = (k.paused ? .35 : 1) * (BLOOM.hit && !on ? .55 : 1) * depth;
    x.strokeStyle = x.fillStyle = p0.core ? BLOOM.muted : BLOOM.cols[p0.s.i % VIZ_N];
    x.lineWidth = on ? 1 : .65; x.globalAlpha = (p0.core ? .25 : on ? .55 : .3) * dim; x.beginPath();
    g.ps.forEach(p => { const h = p.h; if (h.length < 4) return; x.moveTo(h[0], h[1]); for (let j = 2; j < h.length; j += 2) x.lineTo(h[j], h[j + 1]); }); x.stroke();
    x.globalAlpha = (p0.core ? .6 : .92) * dim; g.ps.forEach(p => { const h = p.h; x.fillRect(h[h.length - 2] - .75, h[h.length - 1] - .75, 1.5, 1.5); });
  });
  x.globalAlpha = 1;
  const names = el.querySelector('.bl-names'); const nk = W + 'x' + H + data.map(k => k.id).join();
  if (BLOOM.namesKey !== nk) { BLOOM.namesKey = nk; names.innerHTML = data.map((k, ki) => `<div class="bl-name" style="left:${W * (ki + .5) / n}px;top:${Math.min(H - 130, cy + S * .62)}px"><div class="bl-child">${esc(k.first)}</div><div class="bl-meta">${esc(k.cls)} · ${k.mastery}% mastery${k.paused ? ' · Paused' : ''}</div></div>`).join(''); }
  const tp = el.querySelector('.bl-tip');
  if (!BLOOM.hit) { tp.style.display = 'none'; cv.style.cursor = 'default'; return; }
  cv.style.cursor = 'pointer'; const k = data[BLOOM.hit.ki], s = BLOOM.hit.s;
  if (tp.dataset.key !== k.id + s.id) { tp.dataset.key = k.id + s.id; tp.innerHTML = `<div class="t-cap muted">${esc(k.first)} · ${esc(k.cls)}</div><h3><i style="background:${vizVar(s.i)}"></i>${esc(s.name)}</h3><dl>
    <dt>Mastery</dt><dd>${s.m}%</dd><dt>Accuracy</dt><dd>${s.att ? `${s.cor} / ${s.att} correct` : 'No answers yet'}</dd><dt>Coverage</dt><dd>${s.tbc ? 'Chapters to be confirmed' : `${s.done} / ${s.total} topics`}</dd>
    <dt>Practice</dt><dd>${fmtMin(s.min)} in 14 days</dd><dt>Weakest</dt><dd>${s.weak ? esc(s.weak) : 'Nothing flagged'}</dd><dt>Last practised</dt><dd>${s.last ? fmtShort(s.last) : 'Not yet'}</dd></dl><div class="bl-open">Click to open ${esc(s.name)}</div>`; }
  tp.style.display = 'block'; const w = tp.offsetWidth, h = tp.offsetHeight; let L = BLOOM.mx + 20; if (L + w > W - 12) L = BLOOM.mx - w - 20;
  tp.style.left = Math.max(12, L) + 'px'; tp.style.top = Math.max(12, Math.min(H - h - 12, BLOOM.my - h / 2)) + 'px';
}

/* Particle mastery rings for subject cards: the same visual language at card size. */
function pRing(value, size, idx, att) {
  const v = Math.max(0, Math.min(100, value || 0));
  return `<div class="pring" style="width:${size}px;height:${size}px" role="img" aria-label="${v}% mastery"><canvas data-pring="${v}|${Math.max(0, idx) % VIZ_N}|${att || 0}" width="${size * 2}" height="${size * 2}"></canvas><b aria-hidden="true">${v}%</b></div>`;
}
function pRingFrame(t) {
  const list = document.querySelectorAll('canvas[data-pring]'); if (!list.length) return; bloomColours(); const moving = !REDUCED();
  list.forEach(cv => {
    const [v, i, att] = cv.dataset.pring.split('|').map(Number); const S = cv.width / 2; const x = cv.getContext('2d'); x.setTransform(2, 0, 0, 2, 0, 0); x.clearRect(0, 0, S, S);
    const r = S / 2 - 6, N = Math.round(S * 10), drift = moving ? t * (.00008 + Math.min(1, att / 150) * .0003) : 0;
    for (let q = 0; q < N; q++) {
      const f = q / N; const inArc = f * 100 < v; const h = Math.abs(Math.sin(q * 12.9898) * 43758.5453) % 1;
      const a = f * Math.PI * 2 - Math.PI / 2; const rr = r + (h - .5) * 3.2 + (moving ? Math.sin(t * .0015 + q * 1.7) * .5 : 0);
      const aa = a + (inArc && moving ? Math.sin(drift * 6 + q) * .006 : 0);
      x.fillStyle = inArc ? BLOOM.cols[i] : BLOOM.muted; x.globalAlpha = inArc ? .55 + h * .45 : .22;
      x.fillRect(S / 2 + Math.cos(aa) * rr - .5, S / 2 + Math.sin(aa) * rr - .5, 1, 1);
    }
    x.globalAlpha = 1;
  });
}
(function bloomLoop(t) { try { bloomFrame(t); pRingFrame(t); } catch (e) { console.error('[PrepNivo] bloom', e); } requestAnimationFrame(bloomLoop); })(0);

/* ---------- boot ---------- */
load(); applyTheme(); if (!location.hash) location.hash = S.session ? '/overview' : '/home'; render();
